# ==========================================================
# MODULE IA / AUTOMATISATION - Python / Flask
# ==========================================================

ai-module-verify:
  stage: verify
  image: nikolaik/python-nodejs:python3.10-nodejs20-slim

  before_script:
    - cd airline-ia
    - python -m pip install --upgrade pip
    - |
      if [ -f requirements.txt ]; then
        pip install -r requirements.txt
      fi

  script:
    # Vérification syntaxique Python
    - python -m compileall -q .

    # Tests Python s'ils existent
    - |
      if [ -d tests ]; then
        python -m pytest
      else
        echo "Aucun dossier tests Python trouvé."
      fi

    # Partie Node éventuelle du module IA
    - |
      if [ -f package.json ]; then
        npm ci
        npm run lint --if-present
        npm run test --if-present
      fi

  cache:
    key: "ai-$CI_COMMIT_REF_SLUG"
    paths:
      - airline-ia/.cache/pip/
      - airline-ia/.npm/

  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/airline-ia/.cache/pip"
    npm_config_cache: "$CI_PROJECT_DIR/airline-ia/.npm"


ai-module-build:
  stage: build
  image: nikolaik/python-nodejs:python3.10-nodejs20-slim

  before_script:
    - cd airline-ia
    - |
      if [ -f requirements.txt ]; then
        pip install -r requirements.txt
      fi

  script:
    - python -m compileall -q .
    - |
      if [ -f package.json ]; then
        npm ci
        npm run build --if-present
      fi