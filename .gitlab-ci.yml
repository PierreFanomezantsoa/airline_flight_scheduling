stages:
  - build

frontend:
  stage: build
  image: node:20-alpine
  script:
    - ls -la # Affiche la racine pour déboguer si besoin
    - cd airline-scheduling-front
    - npm install
    - npx vite build
  only:
    - main
    - master
    - merge_requests

backend:
  stage: build
  image: node:20-alpine
  script:
    - cd airline-scheduling-back/back-airline-scheduling
    - npm install
    - npm run build
  only:
    - main
    - master
    - merge_requests

ai-module:
  stage: build
  image: nikolaik/python-nodejs:python3.10-nodejs20-slim
  script:
    - cd airline-ia
    - test -f package.json && npm install && npm run build --if-present || true
    - test -f requirements.txt && pip install --upgrade pip && pip install -r requirements.txt && python -m compileall . || true
  only:
    - main
    - master
    - merge_requests