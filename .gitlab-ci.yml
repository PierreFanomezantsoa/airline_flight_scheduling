stages:
  - verify
  - build

# Pipeline uniquement sur :
# - main
# - master
# - Merge Request
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "master"'
    - when: never


# ==========================================================
# FRONTEND - React / TypeScript
# ==========================================================

frontend-verify:
  stage: verify
  image: node:20-alpine

  before_script:
    - cd airline-scheduling-front
    - npm ci

  script:
    - npm run lint --if-present
    - npm run test --if-present

  cache:
    key: "frontend-$CI_COMMIT_REF_SLUG"
    paths:
      - airline-scheduling-front/.npm/

  variables:
    npm_config_cache: "$CI_PROJECT_DIR/airline-scheduling-front/.npm"


frontend-build:
  stage: build
  image: node:20-alpine

  before_script:
    - cd airline-scheduling-front
    - npm ci

  script:
    - npm run build

  artifacts:
    name: "frontend-$CI_COMMIT_SHORT_SHA"
    paths:
      - airline-scheduling-front/dist/
    expire_in: 7 days


# ==========================================================
# BACKEND PRINCIPAL - NestJS / TypeScript
# ==========================================================

backend-verify:
  stage: verify
  image: node:20-alpine

  before_script:
    - cd airline-scheduling-back/back-airline-scheduling
