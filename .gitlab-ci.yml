    paths:
      - airline-scheduling-back/back-airline-scheduling/.npm/

  variables:
    npm_config_cache: "$CI_PROJECT_DIR/airline-scheduling-back/back-airline-scheduling/.npm"


backend-build:
  stage: build
  image: node:20-alpine

  before_script:
    - cd airline-scheduling-back/back-airline-scheduling
