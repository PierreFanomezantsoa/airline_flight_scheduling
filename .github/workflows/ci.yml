name: Pipeline CI (Monorepo Airline)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# Annule automatiquement les builds obsolètes en cours si un nouveau commit est poussé
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # 1. Job pour le Frontend React (airline-scheduling-front)
  # -------------------------------------------------------------
  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: airline-scheduling-front

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'airline-scheduling-front/package-lock.json'

      - name: Installation des dépendances
        run: npm install

      - name: Compilation Frontend (Vite Build)
        run: npm run build

  # -------------------------------------------------------------
  # 2. Job pour le Backend (airline-scheduling-back)
  # -------------------------------------------------------------
  backend:
    name: Build Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: airline-scheduling-back/back-airline-scheduling

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'airline-scheduling-back/back-airline-scheduling/package-lock.json'

      - name: Installation des dépendances
        run: npm install

      - name: Compilation / Test du Backend
        run: |
          npm run lint --if-present
          npm test --if-present
          npm run build --if-present

  # -------------------------------------------------------------
  # 3. Job pour le module IA (airline-ia)
  # -------------------------------------------------------------
  ai-module:
    name: Check Module IA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: airline-ia

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      # Support hybride (Node.js ou Python selon le projet IA)
      - name: Configuration Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Execution des scripts IA (Node.js ou Python)
        run: |
          if [ -f package.json ]; then
            npm install
            npm run build --if-present
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "Avertissement: Aucun package.json ni requirements.txt trouvé dans airline-ia."
          fi