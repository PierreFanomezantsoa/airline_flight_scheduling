name: Pipeline CI (Monorepo Airline)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # 1. Job pour le Frontend (airline-scheduling-front)
  # -------------------------------------------------------------
  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: airline-scheduling-front # Cible le sous-dossier front

    steps:
      - uses: actions/checkout@v4

      - name: Configuration Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installation & Build Frontend
        run: |
          npm install
          npm run build --if-present

  # -------------------------------------------------------------
  # 2. Job pour le Backend (airline-scheduling-back)
  # -------------------------------------------------------------
  backend:
    name: Build Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: airline-scheduling-back/back-airline-scheduling # Cible le sous-dossier back

    steps:
      - uses: actions/checkout@v4

      - name: Configuration Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installation & Build Backend
        run: |
          npm install
          npm run build --if-present

  # -------------------------------------------------------------
  # 3. Job pour le module IA (airline-ia)
  # -------------------------------------------------------------
  ai-module:
    name: Check Module IA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: airline-ia

    steps:
      - uses: actions/checkout@v4

      # Si c'est un projet Node.js
      - name: Configuration Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installation & Build IA
        run: |
          npm install --if-present
          npm run build --if-present