name: Pipeline CI

# 1. Déclencheurs
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# Annule automatiquement les builds obsolètes sur un même commit / PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 2. Les tâches à exécuter
jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      # Étape 1 : Récupération du code
      - name: Récupération du code source
        uses: actions/checkout@v4

      # Étape 2 : Configuration du runtime Node.js avec fallback sur le chemin du lockfile
      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      # Étape 3 : Installation propre des dépendances
      - name: Installation des dépendances
        run: npm ci

      # Étape 4 : Vérification du linter & formatage (si configuré dans package.json)
      - name: Vérification du code (Linter)
        run: npm run lint --if-present

      # Étape 5 : Exécution des tests unitaires et d'intégration
      - name: Exécution des tests
        run: npm test --if-present

      # Étape 6 : Build de l'application
      - name: Compilation du projet (Build)
        run: npm run build