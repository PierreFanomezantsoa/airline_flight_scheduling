name: Pipeline CD - Déploiement EC2

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

# Un seul déploiement de production à la fois
concurrency:
  group: airline-production-deploy
  cancel-in-progress: false

jobs:
  # ============================================================
  # 1. Vérification du Frontend React
  # ============================================================
  verify-frontend:
    name: Vérification Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: airline-scheduling-front

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: airline-scheduling-front/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier le code
        run: npm run lint --if-present

      - name: Compiler le frontend
        run: npm run build

  # ============================================================
  # 2. Vérification du Backend NestJS
  # ============================================================
  verify-backend:
    name: Vérification Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: airline-scheduling-back/back-airline-scheduling

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: airline-scheduling-back/back-airline-scheduling/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier le code
        run: npm run lint --if-present

      - name: Tests unitaires
        run: npm run test:unit --if-present

      - name: Tests d'intégration
        run: npm run test:integration --if-present

      - name: Compiler le backend
        run: npm run build

  # ============================================================
  # 3. Vérification du module Python / Machine Learning
  # ============================================================
  verify-ai:
    name: Vérification Module Python
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: airline-ia

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: airline-ia/requirements.txt

      - name: Mettre à jour pip
        run: python -m pip install --upgrade pip

      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt

      - name: Vérifier les dépendances
        run: python -m pip check

      - name: Vérifier les bibliothèques ML
        run: |
          python -c "
          import numpy
          import pandas
          import scipy
          import sklearn
          import xgboost
          import joblib
          print('NumPy:', numpy.__version__)
          print('Pandas:', pandas.__version__)
          print('SciPy:', scipy.__version__)
          print('Scikit-learn:', sklearn.__version__)
          print('XGBoost:', xgboost.__version__)
          print('Joblib:', joblib.__version__)
          print('✅ Environnement Machine Learning valide')
          "

      - name: Vérifier le fournisseur météo
        run: |
          python -c "
          from services.weather.api_provider import api_weather_provider
          assert api_weather_provider.available, api_weather_provider.error
          print('✅ Fournisseur météo disponible')
          "

      - name: Vérifier la syntaxe Python
        run: python -m compileall -q .

  # ============================================================
  # 4. Déploiement sur AWS EC2
  # ============================================================
  deploy:
    name: Déploiement Production EC2
    needs:
      - verify-frontend
      - verify-backend
      - verify-ai

    runs-on: ubuntu-latest
    timeout-minutes: 30

    environment:
      name: production

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configurer SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Ajouter EC2 aux hôtes connus
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          ssh-keyscan -H "${{ secrets.EC2_HOST }}" \
            >> ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

      - name: Tester la connexion SSH
        run: |
          set -euo pipefail

          ssh \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "echo '✅ Connexion SSH établie' && hostname && whoami"

      - name: Marquer le début du déploiement
        run: echo "DEPLOY_STARTED=true" >> "$GITHUB_ENV"

      - name: Déployer l'application
        run: |
          set -euo pipefail

          ssh \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "set -euo pipefail
             cd /home/ubuntu/airline_flight_scheduling
             bash deploy.sh"

      # ========================================================
      # 5. Vérification après déploiement
      # ========================================================
      - name: Health checks
        run: |
          set -euo pipefail

          BASE_URL="https://airline-flight.54.156.21.207.nip.io"

          echo "================================================"
          echo "🏥 Vérification des services"
          echo "================================================"

          check_service() {
            NAME="$1"
            URL="$2"

            CODE=$(curl \
              --silent \
              --show-error \
              --insecure \
              --location \
              --retry 3 \
              --retry-delay 3 \
              --connect-timeout 10 \
              --max-time 20 \
              --output /dev/null \
              --write-out "%{http_code}" \
              "$URL" || echo "000")

            echo "$NAME : HTTP $CODE"

            echo "$CODE"
          }

          CODE_FRONT=$(check_service \
            "Frontend" \
            "$BASE_URL/" | tail -n 1)

          CODE_API=$(check_service \
            "API NestJS" \
            "$BASE_URL/api/" | tail -n 1)

          CODE_IA=$(check_service \
            "Module Python" \
            "$BASE_URL/python/" | tail -n 1)

          echo "------------------------------------------------"
          echo "Frontend   : HTTP $CODE_FRONT"
          echo "API NestJS : HTTP $CODE_API"
          echo "Python     : HTTP $CODE_IA"
          echo "================================================"

          # Le frontend doit réellement répondre.
          if [ "$CODE_FRONT" = "000" ] || [ "$CODE_FRONT" -ge 400 ]; then
            echo "❌ Frontend inaccessible ou en erreur"
            exit 1
          fi

          # Une réponse 404 peut être normale si aucune route racine
          # /api/ ou /python/ n'est définie.
          if [ "$CODE_API" = "000" ]; then
            echo "❌ Service NestJS inaccessible"
            exit 1
          fi

          if [ "$CODE_IA" = "000" ]; then
            echo "❌ Service Python inaccessible"
            exit 1
          fi

          echo "✅ Déploiement vérifié avec succès"

      # ========================================================
      # 6. Rollback
      # ========================================================
      - name: Rollback si échec
        if: failure() && env.DEPLOY_STARTED == 'true'
        run: |
          echo "⚠️ Échec détecté — lancement du rollback"

          ssh \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "cd /home/ubuntu/airline_flight_scheduling && bash rollback.sh"