name: Pipeline CD - Déploiement EC2

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: airline-production-deploy
  cancel-in-progress: false

jobs:
  verify-frontend:
    name: Vérification Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: airline-scheduling-front

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: airline-scheduling-front/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier la dépendance Socket.IO du frontend
        run: npm ls socket.io-client --depth=0

      - name: Vérifier le code avec ESLint
        continue-on-error: true
        run: npm run lint --if-present

      - name: Compiler le frontend
        run: npm run build

  verify-backend:
    name: Vérification Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: airline-scheduling-back/back-airline-scheduling

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: airline-scheduling-back/back-airline-scheduling/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les dépendances e-mail et WebSocket
        run: |
          npm ls nodemailer --depth=0
          npm ls @nestjs/websockets @nestjs/platform-socket.io socket.io --depth=0

      - name: Vérifier le code avec ESLint
        continue-on-error: true
        run: npm run lint --if-present

      - name: Tests unitaires
        run: npm run test:unit --if-present

      - name: Tests d'intégration
        run: npm run test:integration --if-present

      - name: Compiler le backend
        run: npm run build

  verify-ai:
    name: Vérification Module Python
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: airline-ia

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: airline-ia/requirements.txt

      - name: Mettre à jour pip
        run: python -m pip install --upgrade pip

      - name: Installer les dépendances
        run: python -m pip install --no-cache-dir -r requirements.txt

      - name: Vérifier les dépendances
        run: python -m pip check

      - name: Vérifier les bibliothèques Python
        run: |
          python - <<'PY'
          import numpy
          import pandas
          import scipy
          import sklearn
          import xgboost
          import joblib

          print("NumPy :", numpy.__version__)
          print("Pandas :", pandas.__version__)
          print("SciPy :", scipy.__version__)
          print("Scikit-learn :", sklearn.__version__)
          print("XGBoost :", xgboost.__version__)
          print("Joblib :", joblib.__version__)
          print("✅ Environnement Python valide")
          PY

      - name: Vérifier le fournisseur météo
        run: |
          python - <<'PY'
          from services.weather.api_provider import api_weather_provider

          if not api_weather_provider.available:
              raise RuntimeError(
                  api_weather_provider.error
                  or "Le fournisseur météo n'est pas disponible."
              )

          print("✅ Fournisseur météo disponible")
          PY

      - name: Vérifier la syntaxe Python
        run: python -m compileall -q .

  deploy:
    name: Déploiement Production EC2
    needs:
      - verify-frontend
      - verify-backend
      - verify-ai

    runs-on: ubuntu-latest
    timeout-minutes: 30

    environment:
      name: production

    steps:
      - name: Configurer SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Ajouter EC2 aux hôtes connus
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Tester la connexion SSH
        run: |
          set -euo pipefail

          ssh \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "echo '✅ Connexion SSH établie' && hostname && whoami"

      - name: Préparer EC2
        run: |
          set -euo pipefail

          ssh "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" 'bash -s' <<'REMOTE'
          set -euo pipefail

          APP_DIR="/home/ubuntu/airline_flight_scheduling"
          IA_DIR="$APP_DIR/airline-ia"
          BACKEND_DIR="$APP_DIR/airline-scheduling-back/back-airline-scheduling"
          BACKEND_ENV="$BACKEND_DIR/.env"
          PIP_TMP="/home/ubuntu/pip-tmp"

          echo "================================================"
          echo "🔧 Préparation EC2"
          echo "================================================"

          echo "💾 Disque principal"
          df -h /

          echo "💾 Répertoire temporaire"
          df -h /tmp

          AVAILABLE_MB=$(df -Pm / | awk 'NR == 2 {print $4}')

          if [ "$AVAILABLE_MB" -lt 1500 ]; then
            echo "❌ Espace disque insuffisant : ${AVAILABLE_MB} Mo disponibles"
            exit 1
          fi

          if [ ! -d "$APP_DIR" ]; then
            echo "❌ Application introuvable : $APP_DIR"
            exit 1
          fi

          if [ ! -d "$IA_DIR" ]; then
            echo "❌ Module Python introuvable : $IA_DIR"
            exit 1
          fi

          if [ ! -d "$BACKEND_DIR" ]; then
            echo "❌ Backend NestJS introuvable : $BACKEND_DIR"
            exit 1
          fi

          mkdir -p "$PIP_TMP"
          rm -rf /home/ubuntu/.cache/pip

          echo "✅ EC2 prêt pour le déploiement"
          REMOTE

      - name: Marquer le début du déploiement
        run: echo "DEPLOY_STARTED=true" >> "$GITHUB_ENV"

      - name: Déployer l'application
        run: |
          set -euo pipefail

          ssh "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" 'bash -s' <<'REMOTE'
          set -euo pipefail

          APP_DIR="/home/ubuntu/airline_flight_scheduling"
          IA_DIR="$APP_DIR/airline-ia"
          BACKEND_DIR="$APP_DIR/airline-scheduling-back/back-airline-scheduling"
          BACKEND_ENV="$BACKEND_DIR/.env"
          PIP_TMP="/home/ubuntu/pip-tmp"

          mkdir -p "$PIP_TMP"

          export TMPDIR="$PIP_TMP"
          export TMP="$PIP_TMP"
          export TEMP="$PIP_TMP"
          export PIP_NO_CACHE_DIR=1

          cleanup() {
            rm -rf "$PIP_TMP"
          }

          trap cleanup EXIT

          cd "$APP_DIR"

          echo "================================================"
          echo "🐍 Préparation Python"
          echo "================================================"

          if [ ! -x "$IA_DIR/env/bin/python" ]; then
            echo "📦 Création de l'environnement Python"

            if command -v python3.12 >/dev/null 2>&1; then
              PYTHON_BIN="$(command -v python3.12)"
            else
              echo "❌ Python 3.12 introuvable sur EC2"
              exit 1
            fi

            "$PYTHON_BIN" -m venv "$IA_DIR/env"
          fi

          source "$IA_DIR/env/bin/activate"

          echo "Python : $(python --version)"
          echo "pip : $(python -m pip --version)"

          if [[ "$(python -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')" != "3.12" ]]; then
            echo "❌ Python 3.12 est requis"
            exit 1
          fi

          echo "================================================"
          echo "🚀 Déploiement de l'application"
          echo "================================================"

          bash deploy.sh

          echo "================================================"
          echo "✉️  Vérification configuration notifications équipage"
          echo "================================================"

          if [ ! -f "$BACKEND_ENV" ]; then
            echo "❌ Fichier .env backend introuvable : $BACKEND_ENV"
            exit 1
          fi

          BACKEND_ENV="$BACKEND_ENV" python3 - <<'PY'
          import os
          from pathlib import Path

          env_path = Path(os.environ["BACKEND_ENV"])
          values = {}

          for raw_line in env_path.read_text(encoding="utf-8").splitlines():
              line = raw_line.strip()

              if not line or line.startswith("#") or "=" not in line:
                  continue

              key, value = line.split("=", 1)
              key = key.strip()
              value = value.strip()

              if (
                  len(value) >= 2
                  and value[0] == value[-1]
                  and value[0] in {"'", '"'}
              ):
                  value = value[1:-1]

              values[key] = value

          required = [
              "AUTH_SECRET",
              "SMTP_HOST",
              "SMTP_PORT",
              "SMTP_SECURE",
              "SMTP_USER",
              "SMTP_PASS",
              "SMTP_FROM",
              "CREW_REPORT_BEFORE_DEPARTURE_MINUTES",
              "CREW_REMINDER_CHECK_INTERVAL_MS",
          ]

          missing = [key for key in required if not values.get(key)]

          if missing:
              raise SystemExit(
                  "❌ Variables production absentes ou vides : "
                  + ", ".join(missing)
              )

          try:
              reminder_interval = int(
                  values["CREW_REMINDER_CHECK_INTERVAL_MS"]
              )
          except ValueError:
              raise SystemExit(
                  "❌ CREW_REMINDER_CHECK_INTERVAL_MS doit être un entier."
              )

          if reminder_interval <= 0:
              raise SystemExit(
                  "❌ CREW_REMINDER_CHECK_INTERVAL_MS doit être > 0."
              )

          if reminder_interval > 60000:
              print(
                  "⚠️ Intervalle de vérification des rappels :",
                  reminder_interval,
                  "ms. 60000 ms est recommandé en production.",
              )

          print(
              "✅ Configuration SMTP, authentification et rappels équipage présente."
          )
          PY

          echo "================================================"
          echo "📦 Installation des dépendances Python"
          echo "================================================"

          cd "$IA_DIR"
          source "$IA_DIR/env/bin/activate"

          if [ ! -f requirements.txt ]; then
            echo "❌ requirements.txt introuvable"
            exit 1
          fi

          python -m pip install --upgrade pip

          python -m pip install \
            --no-cache-dir \
            -r requirements.txt

          echo "================================================"
          echo "🔍 Vérification des dépendances"
          echo "================================================"

          python -m pip check

          python - <<'PY'
          import numpy
          import pandas
          import scipy
          import sklearn
          import xgboost
          import joblib

          print("✅ NumPy :", numpy.__version__)
          print("✅ Pandas :", pandas.__version__)
          print("✅ SciPy :", scipy.__version__)
          print("✅ Scikit-learn :", sklearn.__version__)
          print("✅ XGBoost :", xgboost.__version__)
          print("✅ Joblib :", joblib.__version__)
          print("✅ Environnement Python de production valide")
          PY

          echo "================================================"
          echo "🔄 Redémarrage des services"
          echo "================================================"

          sudo systemctl restart airline-backend
          sudo systemctl restart airline-python
          sudo systemctl reload nginx

          sleep 5

          echo "================================================"
          echo "🔍 Vérification des services"
          echo "================================================"

          if ! systemctl is-active --quiet airline-backend; then
            echo "❌ Service NestJS inactif"

            sudo systemctl \
              status airline-backend \
              --no-pager \
              --full || true

            sudo journalctl \
              -u airline-backend \
              -n 100 \
              --no-pager || true

            exit 1
          fi

          echo "✅ Service NestJS actif"

          if ! systemctl is-active --quiet airline-python; then
            echo "❌ Service Python inactif"

            sudo systemctl \
              status airline-python \
              --no-pager \
              --full || true

            sudo journalctl \
              -u airline-python \
              -n 100 \
              --no-pager || true

            exit 1
          fi

          echo "✅ Service Python actif"

          if ! systemctl is-active --quiet nginx; then
            echo "❌ Nginx inactif"

            sudo systemctl \
              status nginx \
              --no-pager \
              --full || true

            exit 1
          fi

          echo "✅ Nginx actif"

          echo "================================================"
          echo "🔌 Vérification configuration WebSocket Nginx"
          echo "================================================"

          NGINX_DUMP="$(sudo nginx -T 2>&1)"

          if ! grep -qE 'location[[:space:]]+/socket\.io/' <<< "$NGINX_DUMP"; then
            echo "❌ Nginx : location /socket.io/ manquant"
            exit 1
          fi

          if ! grep -qiE 'proxy_http_version[[:space:]]+1\.1' <<< "$NGINX_DUMP"; then
            echo "❌ Nginx : proxy_http_version 1.1 manquant"
            exit 1
          fi

          if ! grep -qiE 'proxy_set_header[[:space:]]+Upgrade[[:space:]]+\$http_upgrade' <<< "$NGINX_DUMP"; then
            echo "❌ Nginx : proxy_set_header Upgrade \$http_upgrade manquant"
            exit 1
          fi

          if ! grep -qiE 'proxy_set_header[[:space:]]+Connection' <<< "$NGINX_DUMP"; then
            echo "❌ Nginx : proxy_set_header Connection manquant"
            exit 1
          fi

          echo "✅ Nginx configuré pour Socket.IO / WebSocket"

          echo "================================================"
          echo "🏥 Vérification locale"
          echo "================================================"

          NEST_CODE="$(
            curl \
              --silent \
              --output /dev/null \
              --connect-timeout 5 \
              --max-time 10 \
              --write-out "%{http_code}" \
              http://127.0.0.1:3001/ || true
          )"

          PYTHON_CODE="$(
            curl \
              --silent \
              --output /dev/null \
              --connect-timeout 5 \
              --max-time 10 \
              --write-out "%{http_code}" \
              http://127.0.0.1:5000/ || true
          )"

          [ -n "$NEST_CODE" ] || NEST_CODE="000"
          [ -n "$PYTHON_CODE" ] || PYTHON_CODE="000"

          echo "NestJS : HTTP $NEST_CODE"
          echo "Python : HTTP $PYTHON_CODE"

          if [ "$NEST_CODE" = "000" ]; then
            echo "❌ NestJS ne répond pas sur le port 3001"

            sudo journalctl \
              -u airline-backend \
              -n 100 \
              --no-pager || true

            exit 1
          fi

          if [ "$PYTHON_CODE" = "000" ]; then
            echo "❌ Python ne répond pas sur le port 5000"

            sudo journalctl \
              -u airline-python \
              -n 100 \
              --no-pager || true

            exit 1
          fi

          echo "✅ Backend NestJS accessible"
          echo "✅ Module Python accessible"

          echo "================================================"
          echo "🔌 Vérification Socket.IO locale"
          echo "================================================"

          SOCKETIO_CODE="$(
            curl \
              --silent \
              --show-error \
              --output /tmp/socketio-health.txt \
              --connect-timeout 5 \
              --max-time 10 \
              --write-out "%{http_code}" \
              "http://127.0.0.1:3001/socket.io/?EIO=4&transport=polling&t=deploy-health" \
              2>/dev/null || true
          )"

          [ -n "$SOCKETIO_CODE" ] || SOCKETIO_CODE="000"

          echo "Socket.IO local : HTTP $SOCKETIO_CODE"

          if [ "$SOCKETIO_CODE" = "000" ] || [ "$SOCKETIO_CODE" -ge 400 ]; then
            echo "❌ Socket.IO ne répond pas correctement sur NestJS"
            cat /tmp/socketio-health.txt 2>/dev/null || true
            sudo journalctl -u airline-backend -n 100 --no-pager || true
            exit 1
          fi

          if ! grep -q '^0' /tmp/socketio-health.txt; then
            echo "❌ Réponse Socket.IO inattendue"
            cat /tmp/socketio-health.txt 2>/dev/null || true
            exit 1
          fi

          echo "✅ Socket.IO local accessible"

          echo "================================================"
          echo "✉️  Vérification SMTP avec Nodemailer"
          echo "================================================"

          cd "$BACKEND_DIR"

          BACKEND_ENV="$BACKEND_ENV" timeout 20 node - <<'NODE'
          const fs = require('fs');
          const nodemailer = require('nodemailer');

          const envPath = process.env.BACKEND_ENV;
          const content = fs.readFileSync(envPath, 'utf8');
          const env = {};

          for (const rawLine of content.split(/\r?\n/)) {
            const line = rawLine.trim();

            if (!line || line.startsWith('#') || !line.includes('=')) {
              continue;
            }

            const index = line.indexOf('=');
            const key = line.slice(0, index).trim();
            let value = line.slice(index + 1).trim();

            if (
              value.length >= 2 &&
              (
                (value.startsWith('"') && value.endsWith('"')) ||
                (value.startsWith("'") && value.endsWith("'"))
              )
            ) {
              value = value.slice(1, -1);
            }

            env[key] = value;
          }

          const port = Number(env.SMTP_PORT || 587);
          const secure =
            String(env.SMTP_SECURE || '').toLowerCase() === 'true' ||
            port === 465;

          const transporter = nodemailer.createTransport({
            host: env.SMTP_HOST,
            port,
            secure,
            auth: {
              user: env.SMTP_USER,
              pass: env.SMTP_PASS,
            },
          });

          transporter
            .verify()
            .then(() => {
              console.log('✅ SMTP authentifié et prêt à envoyer');
              process.exit(0);
            })
            .catch((error) => {
              console.error(
                '❌ Échec vérification SMTP :',
                error?.code || error?.message || 'erreur inconnue',
              );
              process.exit(1);
            });
          NODE

          echo "================================================"
          echo "✅ Déploiement EC2 terminé"
          echo "================================================"
          REMOTE

      - name: Health checks HTTPS
        run: |
          set -euo pipefail

          BASE_URL="https://airline-flight.54.156.21.207.nip.io"

          echo "================================================"
          echo "🏥 Vérification HTTPS"
          echo "================================================"

          check_service() {
            NAME="$1"
            URL="$2"

            CODE="$(
              curl \
                --silent \
                --show-error \
                --location \
                --retry 3 \
                --retry-delay 3 \
                --connect-timeout 10 \
                --max-time 20 \
                --output /dev/null \
                --write-out "%{http_code}" \
                "$URL" 2>/dev/null || true
            )"

            if [ -z "$CODE" ]; then
              CODE="000"
            fi

            echo "$NAME : HTTP $CODE" >&2
            echo "$CODE"
          }

          CODE_FRONT=$(check_service \
            "Frontend" \
            "$BASE_URL/")

          CODE_API=$(check_service \
            "API NestJS" \
            "$BASE_URL/api/")

          CODE_IA=$(check_service \
            "Module Python" \
            "$BASE_URL/python/")

          CODE_SOCKETIO=$(check_service \
            "Socket.IO" \
            "$BASE_URL/socket.io/?EIO=4&transport=polling&t=deploy-health")

          echo "------------------------------------------------"
          echo "Frontend   : HTTP $CODE_FRONT"
          echo "API NestJS : HTTP $CODE_API"
          echo "Python     : HTTP $CODE_IA"
          echo "Socket.IO  : HTTP $CODE_SOCKETIO"
          echo "================================================"

          if [ "$CODE_FRONT" = "000" ] || [ "$CODE_FRONT" -ge 400 ]; then
            echo "❌ Frontend inaccessible ou en erreur"
            exit 1
          fi

          if [ "$CODE_API" = "000" ] || [ "$CODE_API" -ge 500 ]; then
            echo "❌ API NestJS inaccessible ou en erreur"
            exit 1
          fi

          if [ "$CODE_IA" = "000" ] || [ "$CODE_IA" -ge 500 ]; then
            echo "❌ Module Python inaccessible ou en erreur"
            exit 1
          fi

          if [ "$CODE_SOCKETIO" = "000" ] || [ "$CODE_SOCKETIO" -ge 400 ]; then
            echo "❌ Socket.IO / WebSocket inaccessible via Nginx"
            exit 1
          fi

          echo "✅ Frontend disponible"
          echo "✅ API NestJS disponible"
          echo "✅ Module Python disponible"
          echo "✅ Socket.IO disponible via HTTPS/WSS"
          echo "✅ Certificat TLS validé"
          echo "✅ Déploiement vérifié avec succès"

      - name: Rollback si échec
        if: ${{ failure() && env.DEPLOY_STARTED == 'true' }}
        run: |
          echo "⚠️ Échec détecté — lancement du rollback"

          ssh \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "cd /home/ubuntu/airline_flight_scheduling && bash rollback.sh"